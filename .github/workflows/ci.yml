# FN-05.
#
# The checks themselves live in scripts/ci.mjs, not here. This file's job is
# to build the environment they need -- Node, dependencies, a Postgres -- and
# then hand over. Restating the steps in YAML would let CI and `make ci` drift
# apart, and the copy that drifts is always the one you are not watching.
#
# --strict makes the migration check mandatory. Locally it is skipped when no
# database is running; here there is always one, so a skip would be a bug.
#
# The same steps run as parallel jobs (--part, --shard in scripts/ci.mjs):
# API checks, three API test shards and the mobile checks side by side, each
# skipped when its side of the repo did not change. `check` gathers them.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A second push to the same branch cancels the first. Nothing here is worth
# running twice, and the older answer is about to be wrong anyway.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # What does this change touch? A docs-only change runs nothing below; a
  # mobile-only change skips the API jobs, and the other way round. Anything
  # both sides use (packages/, the CI script and this file) runs everything,
  # as does a manual run or a push with nothing to compare against.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      api: ${{ steps.diff.outputs.api }}
      mobile: ${{ steps.diff.outputs.mobile }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          case "$EVENT" in
            pull_request) base="$PR_BASE" ;;
            push) base="$PUSH_BEFORE" ;;
            *) base="" ;;
          esac
          if [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo "Nothing to compare against ($EVENT): checking everything."
            { echo "api=true"; echo "mobile=true"; } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files="$(git diff --name-only "$base" HEAD)"
          shared='^(packages/|scripts/ci\.mjs$|\.github/workflows/ci\.yml$)'
          api=false; mobile=false
          printf '%s\n' "$files" | grep -qE "$shared|^apps/api/|^deploy/|^db/|^openapi\.yaml$" && api=true
          printf '%s\n' "$files" | grep -qE "$shared|^apps/mobile/" && mobile=true
          echo "api=$api mobile=$mobile"
          { echo "api=$api"; echo "mobile=$mobile"; } >> "$GITHUB_OUTPUT"

  # Everything about the API except its test suite: typecheck, spec, build,
  # audit, and the two checks that need a real Postgres.
  api-checks:
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        # Must match docker-compose.yml. Postgres 18 is where `unaccent`
        # immutability in a generated column bit us; testing migrations
        # against a different major would prove nothing.
        image: postgres:18-alpine
        env:
          POSTGRES_USER: flyleaf
          POSTGRES_PASSWORD: flyleaf
          POSTGRES_DB: flyleaf
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U flyleaf -d flyleaf"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    env:
      DATABASE_URL: postgres://flyleaf:flyleaf@localhost:5432/flyleaf

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          # apps/api sets engines.node >=22. Pinned rather than `lts/*` so a
          # new LTS cannot change the answer without a commit saying so.
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/api/package-lock.json

      # `npm ci`, not `npm install`: it installs the lockfile exactly and
      # fails if package.json and the lockfile disagree, which is a real
      # failure worth hearing about rather than quietly resolving.
      - name: Install — api
        working-directory: apps/api
        run: npm ci

      - name: Checks
        run: node scripts/ci.mjs --strict --part=api-checks

  # The API test suite, split across runners. Each test file builds its own
  # in-process database (PGlite), so the shards share nothing and need no
  # Postgres service; vitest's --shard gives every file to exactly one job.
  api-tests:
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    name: api-tests (${{ matrix.shard }}/3)
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            apps/api/package-lock.json
            apps/mobile/package-lock.json

      - name: Install — api
        working-directory: apps/api
        run: npm ci

      # The end-to-end tests drive the app's own client code
      # (login-after-reset.e2e.test.ts imports apps/mobile/src/lib), and
      # compiling it needs the mobile tsconfig's base from expo.
      - name: Install — mobile
        working-directory: apps/mobile
        run: npm ci --no-audit --no-fund

      - name: Tests
        run: node scripts/ci.mjs --strict --part=api-tests --shard=${{ matrix.shard }}/3

  # ~600 packages, about three minutes to install. Worth it: all three bugs
  # found on device in SK-08 were client-side, and tsc is the only automated
  # check the mobile app has at all.
  mobile:
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - name: Install — mobile
        working-directory: apps/mobile
        run: npm ci --no-audit --no-fund

      - name: Checks
        run: node scripts/ci.mjs --strict --part=mobile

  # One result for branch protection and for the workflows that wait on CI
  # (Deploy API, EAS update): green when every job that ran passed. A job
  # skipped because its side did not change counts as passing.
  check:
    needs: [changes, api-checks, api-tests, mobile]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: All jobs passed or were not needed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          case " $RESULTS " in
            *" failure "*|*" cancelled "*) echo "::error::A CI job failed or was cancelled"; exit 1 ;;
          esac
