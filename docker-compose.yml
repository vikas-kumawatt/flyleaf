services:
  # Postgres 18 is the current stable major (18.6 as of Aug 2026). 19 is in
  # beta and stays out until it is released.
  #
  # NOTE: there is deliberately NO init-directory mount any more. Phase -1
  # applied db/skeleton/001_skeleton.sql that way, which only ever runs on a
  # brand-new volume -- so every schema change meant `down -v` and losing all
  # local data. drizzle-kit owns the schema now: `npm run migrate` (FN-01).
  postgres:
    image: postgres:18-alpine
    container_name: flyleaf-pg
    environment:
      POSTGRES_USER: flyleaf
      POSTGRES_PASSWORD: flyleaf
      POSTGRES_DB: flyleaf
    ports:
      - "5432:5432"
    # Sized for the catalog ingest, which is the only thing on this machine
    # that writes at volume.
    #
    # At the 1GB default the authors pass checkpointed every 16-26 seconds and
    # Postgres said so in the log ("checkpoints are occurring too frequently").
    # A checkpoint under bulk load rewrites full pages into WAL, so checkpoints
    # that close often make the load slower AND the WAL bigger. 8GB lets a
    # 26-minute pass checkpoint a handful of times instead of ~80.
    #
    # The cost is crash recovery: more WAL to replay after an unclean stop, and
    # up to ~8GB of WAL segments on disk. Both are the right trade for a local
    # development database.
    command: >
      postgres
      -c max_wal_size=8GB
      -c min_wal_size=1GB
      -c checkpoint_timeout=15min
      -c checkpoint_completion_target=0.9
    volumes:
      # /var/lib/postgresql -- NOT /var/lib/postgresql/data.
      #
      # Postgres 18 made PGDATA version-specific (/var/lib/postgresql/18/docker)
      # and moved the image's declared VOLUME up one level. Mounting the old
      # ...-/data path on 18 is a trap: the server writes to a path INSIDE the
      # container layer instead, and nothing warns you. Your data then survives
      # a restart but vanishes on `docker compose down`.
      #
      # 19 will use /var/lib/postgresql/19/docker. Mounting the parent means
      # that upgrade needs no compose change, and lets pg_upgrade use --link.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flyleaf -d flyleaf"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Present from day one so the storage interface is real, not imagined.
  # Phase -1 does not use it. Console at http://localhost:9001 (flyleaf/flyleaf123).
  minio:
    image: minio/minio:latest
    container_name: flyleaf-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: flyleaf
      MINIO_ROOT_PASSWORD: flyleaf123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
  miniodata:
