openapi: 3.1.0
info:
  title: Flyleaf API
  description: The social reading tracker backend (PRD §24, Architecture §6).
  version: 0.0.1
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 15-minute access JWT (FN-63)
  schemas: {}
paths:
  /auth/register:
    post:
      summary: Register account
      tags:
        - Auth
      description: Creates user and profile with age gate check (PRD §26.6).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                  description: Valid email address
                username:
                  type: string
                  minLength: 3
                  maxLength: 20
                  pattern: ^[a-z0-9_]{3,20}$
                  description: 3–20 characters, lowercase alphanumeric and underscores
                password:
                  type: string
                  minLength: 10
                  description: Minimum 10 characters
                dateOfBirth:
                  type: string
                  pattern: ^\d{4}-\d{2}-\d{2}$
                  description: YYYY-MM-DD format (must be 13+ years old per PRD §26.6)
              required:
                - email
                - username
                - password
                - dateOfBirth
      responses:
        "201":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                      email:
                        type: string
                        format: email
                      username:
                        type: string
                    required:
                      - id
                      - email
                      - username
                  accessToken:
                    type: string
                    description: 15-minute stateless access JWT
                  refreshToken:
                    type: string
                    description: 60-day opaque rotating refresh token
                required:
                  - user
                  - accessToken
                  - refreshToken
        "409":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                        description: Machine-readable error code
                      message:
                        type: string
                        description: Human-readable error description
                      field:
                        type: string
                        description: Invalid field name if applicable
                    required:
                      - code
                      - message
                required:
                  - error
        "422":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                        description: Machine-readable error code
                      message:
                        type: string
                        description: Human-readable error description
                      field:
                        type: string
                        description: Invalid field name if applicable
                    required:
                      - code
                      - message
                required:
                  - error
  /auth/login:
    post:
      summary: Sign in
      tags:
        - Auth
      description: Authenticates with email and password, returning 15m JWT + 60d
        refresh token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                password:
                  type: string
              required:
                - email
                - password
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                      email:
                        type: string
                        format: email
                      username:
                        type: string
                    required:
                      - id
                      - email
                      - username
                  accessToken:
                    type: string
                    description: 15-minute stateless access JWT
                  refreshToken:
                    type: string
                    description: 60-day opaque rotating refresh token
                required:
                  - user
                  - accessToken
                  - refreshToken
        "401":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                        description: Machine-readable error code
                      message:
                        type: string
                        description: Human-readable error description
                      field:
                        type: string
                        description: Invalid field name if applicable
                    required:
                      - code
                      - message
                required:
                  - error
  /auth/refresh:
    post:
      summary: Rotate refresh token
      tags:
        - Auth
      description: Rotates opaque refresh token. Reusing an old token revokes the
        entire family (FN-64).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                refreshToken:
                  type: string
                  minLength: 1
              required:
                - refreshToken
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  accessToken:
                    type: string
                  refreshToken:
                    type: string
                required:
                  - accessToken
                  - refreshToken
        "401":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                        description: Machine-readable error code
                      message:
                        type: string
                        description: Human-readable error description
                      field:
                        type: string
                        description: Invalid field name if applicable
                    required:
                      - code
                      - message
                required:
                  - error
        "403":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                        description: Machine-readable error code
                      message:
                        type: string
                        description: Human-readable error description
                      field:
                        type: string
                        description: Invalid field name if applicable
                    required:
                      - code
                      - message
                required:
                  - error
  /auth/logout:
    post:
      summary: Sign out
      tags:
        - Auth
      description: Revokes the presented refresh token family.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                refreshToken:
                  type: string
                  minLength: 1
              required:
                - refreshToken
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum:
                      - ok
                required:
                  - status
  /auth/verify-email:
    post:
      summary: Verify email
      tags:
        - Auth
      description: Verifies email ownership using single-use verification token (PRD §6.6).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                token:
                  type: string
                  minLength: 1
                  description: Email verification token
              required:
                - token
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum:
                      - ok
                  message:
                    type: string
                required:
                  - status
                  - message
        "400":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                        description: Machine-readable error code
                      message:
                        type: string
                        description: Human-readable error description
                      field:
                        type: string
                        description: Invalid field name if applicable
                    required:
                      - code
                      - message
                required:
                  - error
        "422":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                        description: Machine-readable error code
                      message:
                        type: string
                        description: Human-readable error description
                      field:
                        type: string
                        description: Invalid field name if applicable
                    required:
                      - code
                      - message
                required:
                  - error
  /auth/resend-verification:
    post:
      summary: Resend email verification
      tags:
        - Auth
      description: Resends verification email with 60s rate limit (PRD §6.6, §24.2).
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum:
                      - ok
                  message:
                    type: string
                required:
                  - status
                  - message
        "401":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                        description: Machine-readable error code
                      message:
                        type: string
                        description: Human-readable error description
                      field:
                        type: string
                        description: Invalid field name if applicable
                    required:
                      - code
                      - message
                required:
                  - error
        "429":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                        description: Machine-readable error code
                      message:
                        type: string
                        description: Human-readable error description
                      field:
                        type: string
                        description: Invalid field name if applicable
                    required:
                      - code
                      - message
                required:
                  - error
  /auth/forgot-password:
    post:
      summary: Forgot password
      tags:
        - Auth
      description: Requests password reset link. Always returns 200 to prevent user
        enumeration (PRD §6.5, §24.2).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                  description: Account email address
              required:
                - email
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum:
                      - ok
                  message:
                    type: string
                required:
                  - status
                  - message
        "422":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                        description: Machine-readable error code
                      message:
                        type: string
                        description: Human-readable error description
                      field:
                        type: string
                        description: Invalid field name if applicable
                    required:
                      - code
                      - message
                required:
                  - error
        "429":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                        description: Machine-readable error code
                      message:
                        type: string
                        description: Human-readable error description
                      field:
                        type: string
                        description: Invalid field name if applicable
                    required:
                      - code
                      - message
                required:
                  - error
  /auth/reset-password:
    post:
      summary: Reset password
      tags:
        - Auth
      description: Resets password and revokes all active refresh token families (PRD
        §6.5, Architecture §7).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                token:
                  type: string
                  minLength: 1
                  description: Password reset token
                newPassword:
                  type: string
                  minLength: 10
                  description: New password (minimum 10 characters)
              required:
                - token
                - newPassword
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum:
                      - ok
                  message:
                    type: string
                required:
                  - status
                  - message
        "400":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                        description: Machine-readable error code
                      message:
                        type: string
                        description: Human-readable error description
                      field:
                        type: string
                        description: Invalid field name if applicable
                    required:
                      - code
                      - message
                required:
                  - error
        "422":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                        description: Machine-readable error code
                      message:
                        type: string
                        description: Human-readable error description
                      field:
                        type: string
                        description: Invalid field name if applicable
                    required:
                      - code
                      - message
                required:
                  - error
  /auth/sessions:
    get:
      summary: List active sessions
      tags:
        - Auth
      description: Lists active device sessions for the authenticated user (PRD §24.2, §25).
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          format: uuid
                          description: Session family UUID
                        device:
                          type:
                            - "null"
                            - string
                          description: Device description or User-Agent
                        createdAt:
                          type: string
                          format: date-time
                        lastUsedAt:
                          type: string
                          format: date-time
                      required:
                        - id
                        - createdAt
                        - lastUsedAt
                required:
                  - data
        "401":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                        description: Machine-readable error code
                      message:
                        type: string
                        description: Human-readable error description
                      field:
                        type: string
                        description: Invalid field name if applicable
                    required:
                      - code
                      - message
                required:
                  - error
  /auth/sessions/{id}:
    delete:
      summary: Revoke session
      tags:
        - Auth
      description: Revokes an active device session by family UUID (PRD §24.2, §25).
      parameters:
        - schema:
            type: string
            format: uuid
          in: path
          name: id
          required: true
          description: Resource UUID
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum:
                      - ok
                  message:
                    type: string
                required:
                  - status
                  - message
        "401":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                        description: Machine-readable error code
                      message:
                        type: string
                        description: Human-readable error description
                      field:
                        type: string
                        description: Invalid field name if applicable
                    required:
                      - code
                      - message
                required:
                  - error
        "404":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                        description: Machine-readable error code
                      message:
                        type: string
                        description: Human-readable error description
                      field:
                        type: string
                        description: Invalid field name if applicable
                    required:
                      - code
                      - message
                required:
                  - error
  /auth/logout-all:
    post:
      summary: Revoke all sessions
      tags:
        - Auth
      description: Revokes all device sessions for the authenticated user (PRD §24.2, §25).
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum:
                      - ok
                  message:
                    type: string
                required:
                  - status
                  - message
        "401":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                        description: Machine-readable error code
                      message:
                        type: string
                        description: Human-readable error description
                      field:
                        type: string
                        description: Invalid field name if applicable
                    required:
                      - code
                      - message
                required:
                  - error
  /me:
    get:
      summary: Get current user
      tags:
        - Auth
      description: Returns private user account details for the authenticated viewer.
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                  email:
                    type: string
                    format: email
                  username:
                    type: string
                required:
                  - id
                  - email
                  - username
        "401":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                        description: Machine-readable error code
                      message:
                        type: string
                        description: Human-readable error description
                      field:
                        type: string
                        description: Invalid field name if applicable
                    required:
                      - code
                      - message
                required:
                  - error
        "404":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                        description: Machine-readable error code
                      message:
                        type: string
                        description: Human-readable error description
                      field:
                        type: string
                        description: Invalid field name if applicable
                    required:
                      - code
                      - message
                required:
                  - error
  /users/{id}:
    get:
      summary: Get public profile
      tags:
        - Auth
      description: Returns public user profile. Private accounts return 404 for
        non-followers (Architecture §4).
      parameters:
        - schema:
            type: string
            format: uuid
          in: path
          name: id
          required: true
          description: Resource UUID
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                  username:
                    type: string
                  displayName:
                    type:
                      - "null"
                      - string
                  bio:
                    type:
                      - "null"
                      - string
                  avatarKey:
                    type:
                      - "null"
                      - string
                  isPrivate:
                    type: boolean
                  followerCount:
                    type: integer
                  followingCount:
                    type: integer
                  createdAt:
                    type: string
                    format: date-time
                required:
                  - id
                  - username
                  - isPrivate
                  - followerCount
                  - followingCount
                  - createdAt
        "404":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                        description: Machine-readable error code
                      message:
                        type: string
                        description: Human-readable error description
                      field:
                        type: string
                        description: Invalid field name if applicable
                    required:
                      - code
                      - message
                required:
                  - error
  /search:
    get:
      summary: Search catalog
      tags:
        - Catalog
      description: Searches works by title, subtitle, author, or alternate titles.
        Guest readable.
      parameters:
        - schema:
            type: string
          in: query
          name: q
          required: false
          description: Search term (minimum 2 chars)
        - schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
          in: query
          name: limit
          required: false
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          format: uuid
                        title:
                          type: string
                        author_name:
                          type: string
                        first_publish_year:
                          type:
                            - "null"
                            - integer
                        cover_id:
                          type:
                            - "null"
                            - integer
                        log_count:
                          type: integer
                        editions:
                          type: array
                          items:
                            type: object
                            properties:
                              id:
                                type: string
                                format: uuid
                              isbn13:
                                type:
                                  - "null"
                                  - string
                              page_count:
                                type:
                                  - "null"
                                  - integer
                              format:
                                type: string
                              cover_id:
                                type:
                                  - "null"
                                  - integer
                            required:
                              - id
                              - format
                        your_read:
                          type: object
                          properties:
                            id:
                              type: string
                              format: uuid
                            status:
                              type: string
                            rating:
                              type:
                                - "null"
                                - number
                            hearted:
                              type: boolean
                            page:
                              type:
                                - "null"
                                - integer
                            percent:
                              type:
                                - "null"
                                - number
                          required:
                            - id
                            - status
                            - hearted
                      required:
                        - id
                        - title
                        - author_name
                        - log_count
                required:
                  - data
  /works/{id}:
    get:
      summary: Get book by ID
      tags:
        - Catalog
      description: Returns work metadata, editions, and viewer read state if signed
        in. Guest readable.
      parameters:
        - schema:
            type: string
            format: uuid
          in: path
          name: id
          required: true
          description: Resource UUID
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                  title:
                    type: string
                  author_name:
                    type: string
                  first_publish_year:
                    type:
                      - "null"
                      - integer
                  cover_id:
                    type:
                      - "null"
                      - integer
                  log_count:
                    type: integer
                  editions:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          format: uuid
                        isbn13:
                          type:
                            - "null"
                            - string
                        page_count:
                          type:
                            - "null"
                            - integer
                        format:
                          type: string
                        cover_id:
                          type:
                            - "null"
                            - integer
                      required:
                        - id
                        - format
                  your_read:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                      status:
                        type: string
                      rating:
                        type:
                          - "null"
                          - number
                      hearted:
                        type: boolean
                      page:
                        type:
                          - "null"
                          - integer
                      percent:
                        type:
                          - "null"
                          - number
                    required:
                      - id
                      - status
                      - hearted
                required:
                  - id
                  - title
                  - author_name
                  - log_count
        "404":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                        description: Machine-readable error code
                      message:
                        type: string
                        description: Human-readable error description
                      field:
                        type: string
                        description: Invalid field name if applicable
                    required:
                      - code
                      - message
                required:
                  - error
  /editions/isbn/{isbn}:
    get:
      summary: Get edition by ISBN
      tags:
        - Catalog
      description: Resolves an edition and its parent work by ISBN-10 or ISBN-13
        barcode (PRD §14.2, §3374).
      parameters:
        - schema:
            type: string
            minLength: 9
          in: path
          name: isbn
          required: true
          description: ISBN-10 or ISBN-13 barcode/string
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  work:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                      title:
                        type: string
                      author_name:
                        type: string
                      first_publish_year:
                        type:
                          - "null"
                          - integer
                      cover_id:
                        type:
                          - "null"
                          - integer
                      log_count:
                        type: integer
                      editions:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                              format: uuid
                            isbn13:
