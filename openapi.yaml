openapi: 3.1.0
info:
  title: Flyleaf API
  description: The social reading tracker backend (PRD §24, Architecture §6).
  version: 0.0.1
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 15-minute access JWT (FN-63)
  schemas: {}
paths:
  /auth/register:
    post:
      summary: Register account
      tags:
        - Auth
      description: Creates user and profile with age gate check (PRD §26.6).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                  description: Valid email address
                username:
                  type: string
                  minLength: 3
                  maxLength: 20
                  pattern: ^[a-z0-9_]{3,20}$
                  description: 3–20 characters, lowercase alphanumeric and underscores
                password:
                  type: string
                  minLength: 10
                  description: Minimum 10 characters
                dateOfBirth:
                  type: string
                  pattern: ^\d{4}-\d{2}-\d{2}$
                  description: YYYY-MM-DD format (must be 13+ years old per PRD §26.6)
              required:
                - email
                - username
                - password
                - dateOfBirth
      responses:
        "201":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                      email:
                        type: string
                        format: email
                      username:
                        type: string
                    required:
                      - id
                      - email
                      - username
                  accessToken:
                    type: string
                    description: 15-minute stateless access JWT
                  refreshToken:
                    type: string
                    description: 60-day opaque rotating refresh token
                required:
                  - user
                  - accessToken
                  - refreshToken
        "409":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                        description: Machine-readable error code
                      message:
                        type: string
                        description: Human-readable error description
                      field:
                        type: string
                        description: Invalid field name if applicable
                    required:
                      - code
                      - message
                required:
                  - error
        "422":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                        description: Machine-readable error code
                      message:
                        type: string
                        description: Human-readable error description
                      field:
                        type: string
                        description: Invalid field name if applicable
                    required:
                      - code
                      - message
                required:
                  - error
  /auth/login:
    post:
      summary: Sign in
      tags:
        - Auth
      description: Authenticates with email and password, returning 15m JWT + 60d
        refresh token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                password:
                  type: string
              required:
                - email
                - password
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                      email:
                        type: string
                        format: email
                      username:
                        type: string
                    required:
                      - id
                      - email
                      - username
                  accessToken:
                    type: string
                    description: 15-minute stateless access JWT
                  refreshToken:
                    type: string
                    description: 60-day opaque rotating refresh token
                required:
                  - user
                  - accessToken
                  - refreshToken
        "401":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                        description: Machine-readable error code
                      message:
                        type: string
                        description: Human-readable error description
                      field:
                        type: string
                        description: Invalid field name if applicable
                    required:
                      - code
                      - message
                required:
                  - error
  /auth/refresh:
    post:
      summary: Rotate refresh token
      tags:
        - Auth
      description: Rotates opaque refresh token. Reusing an old token revokes the
        entire family (FN-64).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                refreshToken:
                  type: string
                  minLength: 1
              required:
                - refreshToken
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  accessToken:
                    type: string
                  refreshToken:
                    type: string
                required:
                  - accessToken
                  - refreshToken
        "401":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                        description: Machine-readable error code
                      message:
                        type: string
                        description: Human-readable error description
                      field:
                        type: string
                        description: Invalid field name if applicable
                    required:
                      - code
                      - message
                required:
                  - error
        "403":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                        description: Machine-readable error code
                      message:
                        type: string
                        description: Human-readable error description
                      field:
                        type: string
                        description: Invalid field name if applicable
                    required:
                      - code
                      - message
                required:
                  - error
  /auth/logout:
    post:
      summary: Sign out
      tags:
        - Auth
      description: Revokes the presented refresh token family.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                refreshToken:
                  type: string
                  minLength: 1
              required:
                - refreshToken
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum:
                      - ok
                required:
                  - status
  /auth/verify-email:
    post:
      summary: Verify email
      tags:
        - Auth
      description: Verifies email ownership using single-use verification token (PRD §6.6).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                token:
                  type: string
                  minLength: 1
                  description: Email verification token
              required:
                - token
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum:
                      - ok
                  message:
                    type: string
                required:
                  - status
                  - message
        "400":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                        description: Machine-readable error code
                      message:
                        type: string
                        description: Human-readable error description
                      field:
                        type: string
                        description: Invalid field name if applicable
                    required:
                      - code
                      - message
                required:
                  - error
        "422":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                        description: Machine-readable error code
                      message:
                        type: string
                        description: Human-readable error description
                      field:
                        type: string
                        description: Invalid field name if applicable
                    required:
                      - code
                      - message
                required:
                  - error
  /auth/resend-verification:
    post:
      summary: Resend email verification
      tags:
        - Auth
      description: Resends verification email with 60s rate limit (PRD §6.6, §24.2).
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum:
                      - ok
                  message:
                    type: string
                required:
                  - status
                  - message
        "401":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                        description: Machine-readable error code
                      message:
                        type: string
                        description: Human-readable error description
                      field:
                        type: string
                        description: Invalid field name if applicable
                    required:
                      - code
                      - message
                required:
                  - error
        "429":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                        description: Machine-readable error code
                      message:
                        type: string
                        description: Human-readable error description
                      field:
                        type: string
                        description: Invalid field name if applicable
                    required:
                      - code
                      - message
                required:
                  - error
  /auth/forgot-password:
    post:
      summary: Forgot password
      tags:
        - Auth
      description: Requests password reset link. Always returns 200 to prevent user
        enumeration (PRD §6.5, §24.2).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                  description: Account email address
              required:
                - email
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum:
                      - ok
                  message:
                    type: string
                required:
                  - status
                  - message
        "422":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                        description: Machine-readable error code
                      message:
                        type: string
                        description: Human-readable error description
                      field:
                        type: string
                        description: Invalid field name if applicable
                    required:
                      - code
                      - message
                required:
                  - error
        "429":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                        description: Machine-readable error code
                      message:
                        type: string
                        description: Human-readable error description
                      field:
                        type: string
                        description: Invalid field name if applicable
                    required:
                      - code
                      - message
                required:
                  - error
  /auth/reset-password:
    post:
      summary: Reset password
      tags:
        - Auth
      description: Resets password and revokes all active refresh token families (PRD
        §6.5, Architecture §7).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                token:
                  type: string
                  minLength: 1
                  description: Password reset token
                newPassword:
                  type: string
                  minLength: 10
                  description: New password (minimum 10 characters)
              required:
                - token
                - newPassword
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum:
                      - ok
                  message:
                    type: string
                required:
                  - status
                  - message
        "400":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                        description: Machine-readable error code
                      message:
                        type: string
                        description: Human-readable error description
                      field:
                        type: string
                        description: Invalid field name if applicable
                    required:
                      - code
                      - message
                required:
                  - error
        "422":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                        description: Machine-readable error code
                      message:
                        type: string
                        description: Human-readable error description
                      field:
                        type: string
                        description: Invalid field name if applicable
                    required:
                      - code
                      - message
                required:
                  - error
  /auth/sessions:
    get:
      summary: List active sessions
      tags:
        - Auth
      description: Lists active device sessions for the authenticated user (PRD §24.2, §25).
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          format: uuid
                          description: Session family UUID
                        device:
                          type:
                            - "null"
                            - string
                          description: Device description or User-Agent
                        createdAt:
                          type: string
                          format: date-time
                        lastUsedAt:
                          type: string
                          format: date-time
                      required:
                        - id
                        - createdAt
                        - lastUsedAt
                required:
                  - data
        "401":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                        description: Machine-readable error code
                      message:
                        type: string
                        description: Human-readable error description
                      field:
                        type: string
                        description: Invalid field name if applicable
                    required:
                      - code
                      - message
                required:
                  - error
  /auth/sessions/{id}:
    delete:
      summary: Revoke session
      tags:
        - Auth
      description: Revokes an active device session by family UUID (PRD §24.2, §25).
      parameters:
        - schema:
            type: string
            format: uuid
          in: path
          name: id
          required: true
          description: Resource UUID
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum:
                      - ok
                  message:
                    type: string
                required:
                  - status
                  - message
        "401":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                        description: Machine-readable error code
                      message:
                        type: string
                        description: Human-readable error description
                      field:
                        type: string
                        description: Invalid field name if applicable
                    required:
                      - code
                      - message
                required:
                  - error
        "404":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                        description: Machine-readable error code
                      message:
                        type: string
                        description: Human-readable error description
                      field:
                        type: string
                        description: Invalid field name if applicable
                    required:
                      - code
                      - message
                required:
                  - error
  /auth/logout-all:
    post:
      summary: Revoke all sessions
      tags:
        - Auth
      description: Revokes all device sessions for the authenticated user (PRD §24.2, §25).
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum:
                      - ok
                  message:
                    type: string
                required:
                  - status
                  - message
        "401":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                        description: Machine-readable error code
                      message:
                        type: string
                        description: Human-readable error description
                      field:
                        type: string
                        description: Invalid field name if applicable
                    required:
                      - code
                      - message
                required:
                  - error
  /me:
    get:
      summary: Get current user
      tags:
        - Auth
      description: Returns private user account details for the authenticated viewer.
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                  email:
                    type: string
                    format: email
                  username:
                    type: string
                required:
                  - id
                  - email
                  - username
        "401":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                        description: Machine-readable error code
                      message:
                        type: string
                        description: Human-readable error description
                      field:
                        type: string
                        description: Invalid field name if applicable
                    required:
                      - code
                      - message
                required:
                  - error
        "404":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                        description: Machine-readable error code
                      message:
                        type: string
                        description: Human-readable error description
                      field:
                        type: string
                        description: Invalid field name if applicable
                    required:
                      - code
                      - message
                required:
                  - error
  /me/profile:
    get:
      summary: Get my profile
      tags:
        - Auth
      description: Returns the full profile and favourite books for the authenticated
        viewer.
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                  username:
                    type: string
                  displayName:
                    type:
                      - "null"
                      - string
                  bio:
                    type:
                      - "null"
                      - string
                  avatarKey:
                    type:
                      - "null"
                      - string
                  isPrivate:
                    type: boolean
                  followerCount:
                    type: integer
                  followingCount:
                    type: integer
                  favourite_work_ids:
                    type: array
                    items:
                      type: string
                      format: uuid
                    maxItems: 4
                  favourites:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          format: uuid
                        title:
                          type: string
                        author_name:
                          type: string
                        cover_id:
                          type:
                            - "null"
                            - integer
                      required:
                        - id
                        - title
                        - author_name
                    maxItems: 4
                  createdAt:
                    type: string
                    format: date-time
                required:
                  - id
                  - username
                  - isPrivate
                  - followerCount
                  - followingCount
                  - createdAt
        "401":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                        description: Machine-readable error code
                      message:
                        type: string
                        description: Human-readable error description
                      field:
                        type: string
                        description: Invalid field name if applicable
                    required:
                      - code
                      - message
                required:
                  - error
        "404":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                        description: Machine-readable error code
                      message:
                        type: string
                        description: Human-readable error description
                      field:
                        type: string
                        description: Invalid field name if applicable
                    required:
                      - code
                      - message
                required:
                  - error
    patch:
      summary: Update my profile
      tags:
        - Auth
      description: Updates bio, display name, privacy, or 4 favourite books for the
        authenticated viewer (PRD §6.38, §6.39).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                displayName:
                  type:
                    - string
                    - "null"
                  maxLength: 100
                bio:
                  type:
                    - string
                    - "null"
                  maxLength: 160
                isPrivate:
                  type: boolean
                favouriteWorkIds:
                  type: array
                  items:
                    type: string
                    format: uuid
                  maxItems: 4
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                  username:
                    type: string
                  displayName:
                    type:
                      - "null"
                      - string
                  bio:
                    type:
                      - "null"
                      - string
                  avatarKey:
                    type:
                      - "null"
                      - string
                  isPrivate:
                    type: boolean
                  followerCount:
                    type: integer
                  followingCount:
                    type: integer
                  favourite_work_ids:
                    type: array
                    items:
                      type: string
                      format: uuid
                    maxItems: 4
                  favourites:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          format: uuid
                        title:
                          type: string
                        author_name:
                          type: string
                        cover_id:
                          type:
                            - "null"
                            - integer
                      required:
                        - id
                        - title
                        - author_name
                    maxItems: 4
                  createdAt:
                    type: string
                    format: date-time
                required:
                  - id
                  - username
                  - isPrivate
                  - followerCount
                  - followingCount
                  - createdAt
        "401":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                        description: Machine-readable error code
                      message:
                        type: string
                        description: Human-readable error description
                      field:
                        type: string
                        description: Invalid field name if applicable
                    required:
                      - code
                      - message
                required:
                  - error
        "422":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                        description: Machine-readable error code
                      message:
                        type: string
                        description: Human-readable error description
                      field:
                        type: string
                        description: Invalid field name if applicable
                    required:
                      - code
                      - message
                required:
                  - error
  /users/{id}:
    get:
      summary: Get public profile
      tags:
        - Auth
      description: Returns public user profile. Private accounts return 404 for
        non-followers (Architecture §4).
      parameters:
        - schema:
            type: string
            format: uuid
          in: path
          name: id
          required: true
          description: Resource UUID
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                  username:
                    type: string
                  displayName:
                    type:
                      - "null"
                      - string
                  bio:
                    type:
                      - "null"
                      - string
                  avatarKey:
                    type:
                      - "null"
                      - string
                  isPrivate:
                    type: boolean
                  followerCount:
                    type: integer
                  followingCount:
                    type: integer
                  favourite_work_ids:
                    type: array
                    items:
                      type: string
                      format: uuid
                    maxItems: 4
                  favourites:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          format: uuid
                        title:
                          type: string
                        author_name:
                          type: string
                        cover_id:
                          type:
                            - "null"
                            - integer
                      required:
                        - id
                        - title
                        - author_name
                    maxItems: 4
                  createdAt:
                    type: string
                    format: date-time
                required:
                  - id
                  - username
                  - isPrivate
                  - followerCount
                  - followingCount
                  - createdAt
        "404":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                        description: Machine-readable error code
