                  minLength: 1
                totp_code:
                  type: string
                  minLength: 6
                  maxLength: 10
                  description: 6-digit TOTP code or backup code
              required:
                - email
                - password
                - totp_code
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
